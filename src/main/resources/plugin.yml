name: IcarusRPG
version: '0.65.3'
main: dev.icaro.foodtooltips.FoodTooltipsPlugin
api-version: '26.2'
author: icaro
prefix: IcarusRPG
softdepend: [Geyser-Spigot, floodgate, WorldGuard, GriefPrevention, Citizens, Sentinel]
commands:
  coins:
    description: Shows or administrates coin balances.
    usage: /coins [player] [set|give] [amount]
  skills:
    description: Opens the Skills menu.
    usage: /skills
  bestiary:
    description: Opens the mob bestiary and milestones.
    usage: /bestiary
  rpgstats:
    description: Development stats command.
    permission: foodtooltips.admin
  setskilllevel:
    description: Sets a player's skill level.
    usage: /setskilllevel [player] <skill> <0-200>
    permission: foodtooltips.admin
  nivelglobal:
    description: Shows Global Level progress and bonuses.
    usage: /nivelglobal
    aliases: [globallevel, level]
  globalxp:
    description: Administrates Global Level XP for online players.
    usage: /globalxp <player> <get|give|set|remove> [amount]
    permission: foodtooltips.admin
  levelcolor:
    description: Opens the Global Level color theme menu.
    usage: /levelcolor [theme]
  builderwand:
    description: Gives the Builder's Wand (admin-only for now).
    usage: /builderwand [player]
    permission: foodtooltips.admin
  destroyerhand:
    description: Gives the Destroyer's Hand (admin-only for now).
    usage: /destroyerhand [player]
    permission: foodtooltips.admin
  biomewand:
    description: Gives the Biome's Wand (admin-only for now).
    usage: /biomewand [player]
    permission: foodtooltips.admin
  resetstats:
    description: Resets a player's stats (Mana, Vitality, Combat/General skills, Combat Ability tree, Valor, Coins, Global Level, Bestiary) back to their initial values.
    usage: /resetstats <player>
    permission: foodtooltips.admin
  rpgitems:
    description: Opens the admin-only Legendary Items menu.
    usage: /rpgitems
    permission: foodtooltips.admin
  islandmobs:
    description: (Re)spawns the combat island's custom mobs (admin-only).
    usage: /islandmobs
    permission: foodtooltips.admin
permissions:
  foodtooltips.admin:
    default: op
