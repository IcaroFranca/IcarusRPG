stats:
  # Player default Max Health (vanilla's own default is 20). Bestiary milestone bonuses
  # and Global Level's HP-per-level still add on top of this.
  base-health: 100.0
  base-mana: 100.0
  mana-regeneration-per-second: 2.0
  # Vitality is a separate resource pool spent by healing actives (e.g. Vital Touch).
  base-vitality: 100.0
  vitality-regeneration-per-second: 4.0
  # Ferocity: % chance per point of one extra melee hit; every 100 points guarantees one.
  base-ferocity: 0.0
  ferocity-cap: 500.0
  # Swing Range: melee/interaction reach in blocks (vanilla base is 3).
  base-swing-range: 3.0
  swing-range-cap: 15.0
  # Intelligence: adds directly to max Mana and scales magic-damage abilities.
  base-intelligence: 0.0
  # Ability Damage: % multiplier applied on top of magic-damage abilities.
  base-ability-damage: 0.0
  # Health Regen: % multiplier on natural-health-regen-per-second below. 100 = baseline.
  base-health-regen: 100.0
  natural-health-regen-per-second: 0.5
  # Mending: % multiplier applied to healing an ability lands on someone other than the caster.
  base-mending: 100.0
  # True Defense: flat damage reduction that bypasses percentage-based effects. Deliberately
  # NOT granted by the combat tree (unlike every other stat on the Combat Stats screen) —
  # reserved for future gear/enchant sources.
  base-true-defense: 0.0
  # Full-heals the player every time they appear in a map (server join or world
  # change, e.g. Multiverse-Core/portals) - a "checkpoint" heal, like returning to
  # a hub. Set to false to instead just preserve whatever Health they already had.
  heal-to-full-on-map-enter: true
hud:
  update-ticks: 5
  spacing: "     "
combat:
  max-level: 200
  # Flat crit chance every player has regardless of level - on top of this, no more
  # vanilla jump-crit (attacking while falling no longer guarantees a crit on its own).
  base-crit-chance: 20.0
  crit-chance-per-level: 0.5
  damage-percent-per-level: 4.0
  critical-damage-multiplier: 1.5
  attack-speed-level-0: 4.0
  attack-speed-level-25: 8.0
  attack-speed-level-50: 20.0
  # XP required per Combat level now follows the same shared curve every other skill
  # uses (see SkillXpCurve) - no longer configurable here.
  hostile-xp-health-multiplier: 2.0
  hostile-xp-level-multiplier: 3.0
  # Whether PvP damage gets the same multiplier stack PvE does (Combat level %,
  # crit chance/damage, Ferocity extra hits, ability outgoing multiplier) instead of
  # just Global Strength. false reverts to the old PvP-only formula.
  pvp-full-damage-stack: true
combat-tree:
  # Blood Points are the currency spent in the Combat Ability Tree to unlock and upgrade nodes.
  # Every node's rank-1 cost and per-rank cost scale with its tier (how deep it sits in the
  # tree, tier 1 = root): tierBase = base-unlock-cost + cost-per-tier * (tier - 1);
  # tierPerRank = cost-per-rank + cost-per-rank-per-tier * (tier - 1);
  # cost of rank N (1-indexed) = tierBase + tierPerRank * (N - 1).
  base-unlock-cost: 20
  cost-per-tier: 15
  cost-per-rank: 8
  cost-per-rank-per-tier: 5
  # Fallback Blood Points earned per hostile kill when the mob has no Bestiary entry,
  # ~= sqrt(mob max health) * this multiplier (min 1). Mobs with a Bestiary entry instead
  # drop the exact amount shown in the Bestiary (see BestiaryCatalog's combatXp / 10).
  valor-per-kill-multiplier: 0.3
  # Bonus Blood Points awarded per Combat level gained.
  valor-per-level: 3
  # Minimum Combat level required to unlock a node at each tree tier (index 0 = tier 1,
  # the roots; tier 6, the capstone, needs the last value here). On top of Blood
  # Points + prerequisites, so climbing the tree also means actually leveling Combat,
  # not just farming currency. Tiers beyond this list extrapolate using the last step.
  tier-level-requirements: [0, 15, 35, 60, 90, 130]
mob-visuals:
  # Flat baseline every hostile mob's Max Health is multiplied by (applied once per
  # mob, tracked via a PDC flag so reloads never re-multiply) - this alone is still
  # exactly what a surface/tier-0 mob ends up at; everything below only adds on top,
  # never below this baseline. See MobDifficultyService.
  health-multiplier: 5.0
  # --- Mob difficulty scaling (MobDifficultyService) ---
  # Extra Max Health multiplier per point of a mob's own Bestiary tier (combatXp -
  # Zombie=50 up to Ender Dragon=2500, see BestiaryCatalog). Stacks with the flat
  # health-multiplier above, not instead of it.
  health-multiplier-per-xp: 0.006
  # Extra Max Health multiplier per block a mob spawns below its dimension's own
  # depth-reference-y - the deeper, the tougher, in every dimension.
  health-multiplier-per-depth-block: 0.03
  depth-reference-y-overworld: 64
  depth-reference-y-nether: 128
  depth-reference-y-end: 64
  # Hard floors on a scaled mob's TOTAL effective Max Health, regardless of what the
  # multipliers above land on - 0 = no floor. The Nether's is the one non-zero by
  # default, matching how much more dangerous that dimension is meant to feel.
  min-health-overworld: 0.0
  min-health-nether: 4500.0
  min-health-end: 0.0
  # Vanilla's own Max Health attribute hard-caps at 1024 no matter what's set on it -
  # everything above this cap is tracked as a separate bonus HP pool instead (absorbs
  # damage first, same idea as vanilla's own Absorption effect - see
  # MobDifficultyService#scale's own doc). Kept comfortably under 1024 as a margin.
  real-health-cap: 1000.0
  # Same "extra on top, plus a floor" shape as HP, for the damage a mob deals TO the
  # player (100% vanilla otherwise) - deliberately smaller coefficients than HP's own,
  # so Defense/True Defense investment still meaningfully counters it.
  damage-multiplier-per-xp: 0.0025
  damage-multiplier-per-depth-block: 0.01
  min-damage-overworld: 0.0
  min-damage-nether: 500.0
  min-damage-end: 0.0
  # Text Display view range uses 64-block units: 0.25 = approximately 16 blocks.
  label-view-range: 0.12
  damage-view-range: 0.25
  label-max-distance-blocks: 10.0
  # How often (in server ticks) mob name/HP labels re-check their text and viewer visibility.
  # The HP text also updates instantly on every hit regardless of this value. Higher = cheaper.
  update-ticks: 3
miner-variants:
  # A plain Zombie/Skeleton (not Husk/Drowned/Stray/Wither Skeleton/Zombie Villager)
  # naturally spawning in the Overworld below this Y becomes a "Zombie Miner"/
  # "Skeleton Miner" instead - full Diamond armor enchanted with this plugin's own
  # Protection V, and its own guaranteed minimum below (raised past whatever a plain
  # Zombie/Skeleton's own Bestiary tier would otherwise give it - see
  # MobDifficultyService#raiseFloor). See MinerVariantService.
  enabled: true
  below-y: 0
  min-health: 300.0
  min-damage: 180.0
  # Combat skill XP awarded on kill - a fixed amount, not derived from the underlying
  # Zombie/Skeleton's own Bestiary award (see CombatListener's own kill-XP branch).
  combat-xp: 24.0
global-level:
  xp-per-level: 100
  # How often (in server ticks, 20 = 1s) the level-number color animation advances a frame.
  # Lower = more frequent updates and a smoother gradient. 1 = every tick (smoothest).
  badge-animation-ticks: 1
  # Interpolation sub-steps between each palette color. Higher = smoother, softer transition
  # (more precomputed frames). The overall transition speed stays roughly the same because
  # more steps are shown per second. 1 = original behaviour.
  badge-animation-smoothness: 4
  skill-xp:
    level-1-10: 5
    level-11-25: 10
    level-26-50: 20
    level-51-60: 30
    level-61-100: 40
    level-101-150: 50
    level-151-200: 60
  milestone-xp: 4
  hp-per-level: 5.0
  levels-per-strength: 5
  strength-per-global-level-group: 1
  # Telekinesis is a universal perk (not tied to any one skill): once a player reaches this
  # Global Level, block/mob drops go straight to their inventory and nearby loose dropped
  # items within telekinesis-radius blocks get swept in too.
  telekinesis-level: 3
  telekinesis-radius: 3.0
  strength-damage-percent-per-point: 1.0
  # Custom player-head texture for the Global Level icon in /skills. Leave blank to use
  # the default fallback icon (an experience bottle). To set a custom head: find one on
  # a site like minecraft-heads.com and paste the base64 "Value" it gives you (the same
  # kind of string used in /give ... player_head[profile={properties:[{name:"textures",
  # value:"..."}]}] commands).
  icon-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODdkODg1YjMyYjBkZDJkNmI3ZjFiNTgyYTM0MTg2ZjhhNTM3M2M0NjU4OWEyNzM0MjMxMzJiNDQ4YjgwMzQ2MiJ9fX0="
# Per-Material tier overrides for the universal item rarity system (ItemTierService).
# Every item already resolves to a tier on its own (equipment by material family,
# notable items and plain "junk" blocks curated in code, Tier D as the default for
# everything else) - this section only needs entries for the ones you want to
# hand-tune. Values: E (gray, below Common), D (Common, white), C (Uncommon, green),
# B (Rare, blue), A (Epic, purple), S (Legendary, gold). Example:
# item-tiers:
#   DIRT: E
#   TOTEM_OF_UNDYING: S
builder-wand:
  # Max blocks the Builder's Wand can extend in one right-click (a safety cap, not a
  # gameplay limit - raise it if 64-block lines/columns aren't enough for your builds).
  # Also caps the Face fill mode's flood fill (see the wand's left-click mode menu) -
  # same number, not squared, so a huge open wall/floor stops here too.
  max-length: 64
destroyer-hand:
  # Max blocks the Destroyer's Hand can clear in one right-click - same safety cap
  # idea as builder-wand.max-length (Line and Face modes alike), just for the
  # opposite direction.
  max-length: 64
biome-wand:
  # Max radius (in blocks) the Biome's Wand's brush can be set to via its left-click
  # menu - minimum is always 1 (no "just the clicked block" mode).
  max-radius: 10
travel:
  # /skills' "Locais"/"Locations" button - free, unlimited teleports (no item needed).
  # World names are shown to players as human-readable labels, never their raw config
  # value below. default-world is the hub/spawn destination - leave blank to
  # auto-detect the server's actual primary world (server.properties' level-name)
  # instead of guessing a name like "world", which Multiverse/similar setups often
  # rename.
  default-world: ""
items:
  # Every damageable item's Max Durability is multiplied by this (vanilla materials
  # only care about relative wear, so a bigger number just means more uses before it
  # breaks) - applied once per item (like item-tiers below) via a PDC marker, so
  # raising/lowering this later only affects items that haven't been touched yet.
  durability-multiplier: 5
item-tiers: {}
